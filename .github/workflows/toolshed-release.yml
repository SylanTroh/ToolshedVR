name: Toolshed release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check-secret:
    name: Check if secrets available
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      secret-is-set: ${{ steps.secret-is-set.outputs.defined }}
      android-secret-is-set: ${{ steps.android-secret-is-set.outputs.defined }}
    steps:
      - name: Check if secret is set, then set variable
        id: secret-is-set
        env:
          TMP_SECRET1: ${{ secrets.UNITY_LICENSE }}
          TMP_SECRET2: ${{ secrets.UNITY_EMAIL }}
          TMP_SECRET3: ${{ secrets.UNITY_PASSWORD }}
        if: "${{ env.TMP_SECRET1 != '' && env.TMP_SECRET2 != '' && env.TMP_SECRET3 != '' }}"
        run: echo "defined=true" >> $GITHUB_OUTPUT
      - name: Check if Android secrets are set, then set variable
        id: android-secret-is-set
        env:
          TMP_SECRET1: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TMP_SECRET2: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          TMP_SECRET3: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          TMP_SECRET4: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        if: "${{ env.TMP_SECRET1 != '' && env.TMP_SECRET2 != '' && env.TMP_SECRET3 != '' && env.TMP_SECRET4 != '' }}"
        run: echo "defined=true" >> $GITHUB_OUTPUT

  build-client:
    name: Build client for ${{ matrix.targetPlatform }}
    timeout-minutes: 100
    runs-on: ${{ matrix.buildPlatform }}
    permissions:
      actions: write
      contents: write
    env:
      projectPath: Basis
      buildName: ToolshedVR
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneLinux64
        buildPlatform:
          - ubuntu-latest
        include:
          - buildPlatform: windows-2022
            targetPlatform: StandaloneWindows64
    needs: [check-secret]
    if: needs.check-secret.outputs.secret-is-set == 'true'
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        if: matrix.buildPlatform == 'ubuntu-latest'
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false
      - name: "Checkout repository"
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Restore Library cache"
        id: restore-cache
        timeout-minutes: 10
        uses: actions/cache/restore@v3
        with:
          path: ${{ env.projectPath }}/Library
          key: Library-${{ env.projectPath }}-${{ matrix.targetPlatform }}-toolshed-${{ hashFiles(env.projectPath) }}
          restore-keys: Library-${{ env.projectPath }}-${{ matrix.targetPlatform }}-toolshed-
      - name: "Create version string"
        id: version
        run: echo "gitversion=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: "Sanitize Linux client project"
        if: matrix.targetPlatform == 'StandaloneLinux64'
        shell: bash
        run: |
          python3 .github/scripts/sanitize_linux_client_ci.py "${projectPath}"
      - name: Ensure Docker service is running
        if: matrix.buildPlatform == 'windows-2022'
        shell: powershell
        run: |
          Start-Service docker
      - name: Wait for Docker to be ready
        if: matrix.buildPlatform == 'windows-2022'
        shell: powershell
        run: |
          $maxAttempts = 40
          for ($i=0; $i -lt $maxAttempts; $i++) {
            docker info > $null 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Docker is ready"
              exit 0
            }
            Write-Host "Waiting for Docker..."
            Start-Sleep -Seconds 3
          }
          throw "Docker did not become ready in time"
      - name: "Build Unity project"
        timeout-minutes: 100
        uses: BasisVR/unity-builder@main
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          buildName: ${{ env.buildName }}
          projectPath: ${{ env.projectPath }}
          targetPlatform: ${{ matrix.targetPlatform }}
          customParameters: ${{ startsWith(matrix.targetPlatform, 'Standalone') && '-standaloneBuildSubtarget Player' || '' }}
          versioning: Custom
          version: ${{ steps.version.outputs.gitversion }}
          linux64RemoveExecutableExtension: false
      - name: "Save Library Cache"
        uses: actions/cache/save@v3
        if: always() && github.ref_name != 'HEAD'
        with:
          path: ${{ env.projectPath }}/Library
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
      - name: "Only retain latest cache"
        if: always() && github.ref_name != 'HEAD'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_CACHE_IDS=$(gh cache list --sort created_at --key Library-${{ env.projectPath }}-${{ matrix.targetPlatform }}-toolshed- --json id --jq '.[1:] | map(.id) | @sh')
          for cache_id in $OLD_CACHE_IDS; do
            echo "Deleting cache id: $cache_id"
            gh cache delete $cache_id
          done
      - name: Archive symbols
        uses: thedoctor0/zip-release@0.7.6
        if: matrix.targetPlatform != 'Android'
        with:
          type: "zip"
          directory: build/${{ matrix.targetPlatform }}
          filename: "${{ github.workspace }}/${{ env.buildName }} ${{ matrix.targetPlatform }} Symbols.zip"
          path: "*_BackUpThisFolder_ButDontShipItWithYourGame"
      - name: Delete symbols
        shell: bash
        run: >
          ${{ matrix.buildPlatform == 'ubuntu-latest' && 'sudo' || '' }}
          rm -rvf "build/${{ matrix.targetPlatform }}/${{ env.buildName }}_BackUpThisFolder_ButDontShipItWithYourGame"
      - name: Delete Burst debug info
        shell: bash
        run: >
          ${{ matrix.buildPlatform == 'ubuntu-latest' && 'sudo' || '' }}
          rm -rvf build/${{ matrix.targetPlatform }}/*_BurstDebugInformation_DoNotShip
      - name: Archive client
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: "zip"
          directory: build/${{ matrix.targetPlatform }}
          filename: "${{ github.workspace }}/${{ env.buildName }} ${{ matrix.targetPlatform }}.zip"
      - name: "Release client zip"
        timeout-minutes: 5
        uses: "softprops/action-gh-release@v2"
        with:
          files: |
            ${{ github.workspace }}/${{ env.buildName }} ${{ matrix.targetPlatform }}.zip
            ${{ github.workspace }}/${{ env.buildName }} ${{ matrix.targetPlatform }} Symbols.zip

  build-client-android:
    name: Build client for Android
    timeout-minutes: 100
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    env:
      projectPath: Basis
      buildName: ToolshedVR
    needs: [check-secret]
    if: needs.check-secret.outputs.secret-is-set == 'true' && needs.check-secret.outputs.android-secret-is-set == 'true'
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false
      - name: "Checkout repository"
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Restore Library cache"
        id: restore-cache
        timeout-minutes: 10
        uses: actions/cache/restore@v3
        with:
          path: ${{ env.projectPath }}/Library
          key: Library-${{ env.projectPath }}-Android-toolshed-${{ hashFiles(env.projectPath) }}
          restore-keys: Library-${{ env.projectPath }}-Android-toolshed-
      - name: "Create version string"
        id: version
        run: echo "gitversion=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: "Compute Android Version"
        id: androidcode
        run: echo "code=$((208 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
      - name: "Build Unity project"
        timeout-minutes: 100
        uses: BasisVR/unity-builder@main
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          buildName: ${{ env.buildName }}
          projectPath: ${{ env.projectPath }}
          targetPlatform: Android
          customParameters: ""
          versioning: Custom
          version: ${{ steps.version.outputs.gitversion }}
          androidVersionCode: ${{ steps.androidcode.outputs.code }}
          androidExportType: androidPackage
          androidKeystoreName: ToolshedVR
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          linux64RemoveExecutableExtension: false
      - name: "Save Library Cache"
        uses: actions/cache/save@v3
        if: always()
        with:
          path: ${{ env.projectPath }}/Library
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
      - name: "Only retain latest cache"
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_CACHE_IDS=$(gh cache list --sort created_at --key Library-${{ env.projectPath }}-Android-toolshed- --json id --jq '.[1:] | map(.id) | @sh')
          for cache_id in $OLD_CACHE_IDS; do
            echo "Deleting cache id: $cache_id"
            gh cache delete $cache_id
          done
      - name: "Release client apk"
        timeout-minutes: 5
        uses: "softprops/action-gh-release@v2"
        with:
          files: build/Android/${{ env.buildName }}.apk
